services:
  - type: web
    name: bias-auditor-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GEMINI_API_KEY
        sync: false          # set this in the Render dashboard after creation
      - key: ALLOWED_ORIGINS
        value: "*"           # tighten to your frontend URL once you have it

  - type: web
    name: bias-auditor-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NEXT_PUBLIC_API_BASE
        sync: false          # set to the backend's URL, e.g. https://bias-auditor-backend.onrender.com
